<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign in</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 22rem; margin: 4rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input, button { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; cursor: pointer; }
        .error { color: #b00020; margin-top: 1rem; }
        .notice { color: #006400; margin-top: 1rem; }
    </style>
</head>
<body>
<h1>Sign in</h1>

<div class="error" th:if="${param.error}">Incorrect email or password.</div>
<div class="notice" th:if="${param.logout}">You have been signed out.</div>

<form method="post" th:action="@{/login}">
    <label for="username">Email</label>
    <input type="email" id="username" name="username" autocomplete="username" required autofocus>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password" required>

    <button type="submit">Sign in</button>
</form>
</body>
</html>
