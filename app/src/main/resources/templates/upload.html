<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Upload a video</title>
    <!-- Session auth means POSTs need a CSRF token; JS reads it from here. -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: 1rem; font-weight: 600; }
        input, textarea, button { width: 100%; padding: 0.5rem; margin-top: 0.25rem; box-sizing: border-box; }
        button { margin-top: 1.5rem; cursor: pointer; }
        progress { width: 100%; margin-top: 1rem; }
        #status { margin-top: 1rem; white-space: pre-wrap; }
        .error { color: #b00020; }
    </style>
</head>
<body>
<h1>Upload a video</h1>
<p><a href="/">Home</a></p>

<form id="upload-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="255" required>

    <label for="description">Description (optional)</label>
    <textarea id="description" name="description" rows="3" maxlength="2000"></textarea>

    <label for="file">Video file</label>
    <input type="file" id="file" name="file" accept="video/*" required>

    <button type="submit" id="submit">Upload</button>
</form>

<progress id="progress" value="0" max="100" hidden></progress>
<div id="status"></div>

<script>
    const form = document.getElementById('upload-form');
    const submit = document.getElementById('submit');
    const progress = document.getElementById('progress');
    const status = document.getElementById('status');

    function say(message, isError) {
        status.textContent = message;
        status.className = isError ? 'error' : '';
    }

    // Uploads via XHR rather than fetch so the progress bar can track a large file.
    function putToS3(url, file) {
        return new Promise((resolve, reject) => {
            const xhr = new XMLHttpRequest();
            xhr.open('PUT', url);
            xhr.setRequestHeader('Content-Type', file.type);
            xhr.upload.onprogress = (event) => {
                if (event.lengthComputable) {
                    progress.value = Math.round((event.loaded / event.total) * 100);
                }
            };
            xhr.onload = () => (xhr.status >= 200 && xhr.status < 300)
                ? resolve()
                : reject(new Error('S3 upload failed with status ' + xhr.status));
            xhr.onerror = () => reject(new Error('S3 upload failed (network error)'));
            xhr.send(file);
        });
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const file = document.getElementById('file').files[0];
        if (!file) {
            return;
        }

        submit.disabled = true;
        progress.hidden = false;
        progress.value = 0;

        try {
            // 1. Ask the API where to upload. Metadata only — no bytes.
            say('Requesting upload URL...');
            const csrfToken = document.querySelector('meta[name="_csrf"]').content;
            const csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;
            const response = await fetch('/api/videos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', [csrfHeader]: csrfToken },
                body: JSON.stringify({
                    title: document.getElementById('title').value,
                    description: document.getElementById('description').value,
                    filename: file.name,
                    contentType: file.type || 'video/mp4'
                })
            });
            if (!response.ok) {
                throw new Error('Could not create upload: ' + response.status + ' ' + await response.text());
            }
            const slot = await response.json();

            // 2. Send the bytes straight to S3, bypassing the application.
            say('Uploading to storage...');
            await putToS3(slot.uploadUrl, file);

            say('Upload complete.\nVideo #' + slot.videoId + ' stored at ' + slot.sourceKey
                + '\nTranscoding starts within a few seconds; the video becomes'
                + ' READY once its HLS output has been written.');
        }
        catch (error) {
            say(error.message, true);
        }
        finally {
            submit.disabled = false;
        }
    });
</script>
</body>
</html>
